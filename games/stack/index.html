<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Stack to the Stars · FA-01</title>
  <meta name="description" content="Tap to stack rocket stages and build all the way to the Moon. A one-tap game by Fatima Arif.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/games/stack/stack.css">
</head>
<body>
  <canvas id="game" aria-label="Stack to the Stars game. Tap or press Space to drop."></canvas>

  <div class="hud" id="hud" hidden>
    <div class="score" id="score" aria-live="polite">0</div>
    <div class="alt" id="alt">0 KM</div>
    <div class="next" id="next"></div>
  </div>
  <div class="corner">
    <span class="best">BEST <b id="best">0</b></span>
    <button type="button" id="btn-sound" class="icon-btn" aria-pressed="true" aria-label="Sound on">♪</button>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="perfect" id="perfect" hidden>PERFECT</div>

  <section class="overlay" id="title-screen">
    <div class="card">
      <p class="eyebrow">FA-01 flight simulator</p>
      <h1>Stack to the Stars</h1>
      <p class="lead">Tap to drop each rocket stage. Line it up perfectly or the extra gets cut off. How far into space can you build?</p>
      <button type="button" class="btn big" id="btn-start">Tap to start</button>
      <p class="hint">Tap anywhere · or press Space</p>
      <div class="board">
        <h2>Top builders</h2>
        <ol id="board-title"><li class="muted">Loading…</li></ol>
      </div>
    </div>
  </section>

  <section class="overlay" id="result-screen" hidden>
    <div class="card">
      <p class="eyebrow" id="r-eyebrow">Mission report</p>
      <h1 id="r-score">0</h1>
      <p class="reached" id="r-reached"></p>
      <p class="lead" id="r-text"></p>
      <form id="initials-form" hidden autocomplete="off">
        <label for="initials">You made the leaderboard! Enter 3 letters:</label>
        <div class="init-row">
          <input id="initials" name="initials" maxlength="3" minlength="3" pattern="[A-Za-z]{3}" required spellcheck="false" autocapitalize="characters" placeholder="ABC">
          <button type="submit" class="btn">Save</button>
        </div>
        <p class="form-msg" id="form-msg" role="status"></p>
      </form>
      <button type="button" class="btn big" id="btn-again">Fly again</button>
      <div class="board">
        <h2>Top builders</h2>
        <ol id="board-result"></ol>
      </div>
    </div>
  </section>

  <script type="module" src="/games/stack/stack.js"></script>
</body>
</html>
